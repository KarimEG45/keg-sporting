name: Build Android APK (KEG-Sporting)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: Build production web bundle
        run: npm run build

      - name: Generate & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Harden AndroidManifest (disable debuggable & allowBackup, configure permissions)
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("ACCESS_FINE_LOCATION")) {
              xml = xml.replace(
                "</manifest>",
                "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n</manifest>"
              );
            }
            if (!xml.includes("resizeableActivity")) {
              xml = xml.replace(
                "<activity",
                "<activity android:resizeableActivity=\"true\""
              );
            }
            if (xml.includes("android:allowBackup=\"true\"")) {
              xml = xml.replace("android:allowBackup=\"true\"", "android:allowBackup=\"false\"");
            } else if (!xml.includes("android:allowBackup")) {
              xml = xml.replace("<application", "<application android:allowBackup=\"false\"");
            }
            fs.writeFileSync(p, xml, "utf8");
          '

      - name: Build & sign non-debuggable Release APK with Gradle & apksigner
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            KS_PASS="kegsporting-release-key"
            K_ALIAS="kegsporting"
            K_PASS="kegsporting-release-key"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=KEG-Sporting, OU=Mobile, O=KEG-Sporting, L=Paris, S=IDF, C=FR"
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out ../KEG-Sporting.apk \
            app-release-aligned.apk
          rm -f release.keystore app-release-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEG-Sporting-APK
          path: KEG-Sporting.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KEG-Sporting v1.0.0 — APK Android (Tous Smartphones & Galaxy Z Fold 5)"
          body: |
            ## 📱 Télécharger l'application Android `KEG-Sporting.apk`
            Cliquez sur **`KEG-Sporting.apk`** ci-dessous depuis votre téléphone Android (Samsung Galaxy Z Fold 5 ou tout autre smartphone Android) pour télécharger et installer directement l'application complète hors-ligne (1 324 exercices en français avec GIFs + Séances Muscu + Coach Course à pied).
          files: KEG-Sporting.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
