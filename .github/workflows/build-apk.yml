name: Build Android APK (KEG-Sporting)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build production web bundle
        run: npm run build

      - name: Generate & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android permissions (GPS, Vibration & Foldable screen continuity)
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("ACCESS_FINE_LOCATION")) {
              xml = xml.replace(
                "</manifest>",
                "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n</manifest>"
              );
            }
            if (!xml.includes("resizeableActivity")) {
              xml = xml.replace(
                "<activity",
                "<activity android:resizeableActivity=\"true\""
              );
            }
            fs.writeFileSync(p, xml, "utf8");
          '

      - name: Build signed installable APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../KEG-Sporting.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEG-Sporting-APK
          path: KEG-Sporting.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KEG-Sporting v1.0.0 — APK Android (Tous Smartphones & Galaxy Z Fold 5)"
          body: |
            ## 📱 Télécharger l'application Android `KEG-Sporting.apk`
            Cliquez sur **`KEG-Sporting.apk`** ci-dessous depuis votre téléphone Android (Samsung Galaxy Z Fold 5 ou tout autre smartphone Android) pour télécharger et installer directement l'application complète hors-ligne (1 324 exercices en français avec GIFs + Séances Muscu + Coach Course à pied).
          files: KEG-Sporting.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
